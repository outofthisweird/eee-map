<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>EEE — Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700&family=Noto+Sans+KR:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#fff; --muted:#666;
    --bg:#fff; --ink:#000; --dim:#A7A9AC;
    --mon:#EE352E; --wed:#FCCC0A; --fri:#0039A6; --sun:#00933C;
    --font:"Inter","Noto Sans KR","Pretendard","Helvetica Neue",Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--font);font-weight:500;-webkit-font-smoothing:antialiased}
  #map{position:fixed;inset:0;width:100%;height:100%;cursor:grab;touch-action:none;user-select:none}
  #map.dragging{cursor:grabbing}
  .label{font-size:var(--label-size,13px);fill:var(--ink);pointer-events:none}
  .hide-labels .label{display:none}
  .line-path{fill:none;stroke-linecap:round;stroke-linejoin:round;transition:opacity .2s}
  .station{cursor:pointer}
  .station:focus{outline:none}
  .station:focus-visible .dot{outline:2px solid var(--ink);outline-offset:4px}
  .station .hit{fill:transparent}
  .xfer circle{fill:var(--paper);stroke:var(--ink);stroke-width:3}
  .dim{opacity:.18}
  .bullet text{font-weight:700;font-size:15px;text-anchor:middle;dominant-baseline:central}

  /* sign band */
  .sign{background:var(--ink);color:var(--paper);display:flex;align-items:center;gap:12px;padding:0 16px;border-top:3px solid var(--ink);box-shadow:inset 0 3px 0 var(--ink), inset 0 5px 0 var(--paper)}
  #logo{position:fixed;top:20px;left:20px;height:64px;min-width:220px;z-index:5}
  #logo b{font-size:30px;font-weight:700;letter-spacing:-.5px}
  #logo span{font-size:11px;line-height:1.3;opacity:.85}

  #legend{position:fixed;left:20px;bottom:20px;z-index:5;background:var(--paper);border:2px solid var(--ink);padding:12px 14px;display:grid;gap:8px}
  #legend button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;font-size:13px}
  #legend button:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
  .bul{width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:#fff;flex:none}
  .bul.y{color:#000}
  #legend .day{width:22px;font-weight:700}
  #legend .bs{display:flex;gap:4px}

  #zoom{position:fixed;right:20px;bottom:20px;z-index:5;display:flex;flex-direction:column;border:2px solid var(--ink);background:var(--paper)}
  #zoom button{all:unset;cursor:pointer;width:40px;height:40px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700}
  #zoom button+button{border-top:2px solid var(--ink)}
  #zoom button:hover{background:var(--ink);color:var(--paper)}

  #card{position:fixed;z-index:6;pointer-events:none;background:var(--paper);border:2px solid var(--ink);padding:10px 12px;max-width:280px;font-size:13px;line-height:1.4;opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s}
  #card.on{opacity:1;transform:none}
  #card .meta{color:var(--muted);font-size:11px;margin-top:4px}

  #panel{position:fixed;top:0;right:0;bottom:0;width:400px;max-width:100%;background:var(--paper);border-left:3px solid var(--ink);z-index:10;transform:translateX(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
  #panel.open{transform:none}
  #panel .sign{height:72px;flex:none}
  #panel .sign .name{font-size:22px;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #panel .close{all:unset;cursor:pointer;font-size:26px;line-height:1;padding:4px}
  #panel .body{padding:20px;overflow:auto;flex:1;display:flex;flex-direction:column;gap:14px}
  #panel h2{font-size:20px;line-height:1.35;font-weight:700}
  #panel .info{font-size:13px;color:var(--ink);display:grid;grid-template-columns:64px 1fr;gap:4px 8px}
  #panel .info dt{color:var(--muted)}
  #pxfer{display:grid;gap:6px}
  #pxfer:empty{display:none}
  .xbtn{all:unset;cursor:pointer;display:flex;align-items:center;gap:8px;border:2px solid var(--ink);padding:8px 10px;font-size:13px;font-weight:700}
  .xbtn:hover{background:var(--ink);color:var(--paper)}
  .xbtn .bul{width:22px;height:22px;font-size:12px}
  #panel .ph{aspect-ratio:4/5;border:2px dashed #bbb;display:flex;align-items:center;justify-content:center;color:#999;font-size:12px;text-align:center;padding:16px}
  #panel a.ig{display:flex;justify-content:space-between;align-items:center;background:var(--ink);color:var(--paper);text-decoration:none;padding:14px 16px;font-weight:700;font-size:14px}
  #panel .nav{display:grid;grid-template-columns:1fr 1fr;border-top:2px solid var(--ink);flex:none}
  #panel .nav button{all:unset;cursor:pointer;padding:14px 16px;font-size:13px}
  #panel .nav button+button{border-left:2px solid var(--ink);text-align:right}
  #panel .nav button:disabled{color:#bbb;cursor:default}
  #panel .nav small{display:block;color:var(--muted);font-size:11px}
  #panel .nav button:disabled small{color:#ccc}
  #xfp{position:fixed;top:20px;right:20px;z-index:8;width:300px;font-size:12px}
  #xftoggle{all:unset;cursor:pointer;display:block;margin-left:auto;background:var(--ink);color:var(--paper);padding:10px 14px;font-weight:700;font-size:13px}
  #xfbody{background:var(--paper);border:2px solid var(--ink);margin-top:6px;padding:12px;display:grid;gap:14px;max-height:calc(100vh - 160px);overflow:auto}
  #xfbody[hidden]{display:none}
  #xfbody h3{font-size:13px;display:flex;align-items:center;gap:8px;margin-bottom:6px}
  #xfbody h3 .bul{width:22px;height:22px;font-size:12px}
  #xfbody label{display:grid;gap:3px;margin-top:6px;color:var(--muted)}
  #xfbody output{color:var(--ink);font-weight:700}
  #xfbody output i{font-style:normal;color:#888;font-weight:500}
  #xfbody input{width:100%;accent-color:var(--ink)}
  .xfrow{display:flex;gap:8px}
  .xfrow button{all:unset;cursor:pointer;border:2px solid var(--ink);padding:6px 10px;font-weight:700}
  .xfrow button:hover{background:var(--ink);color:var(--paper)}
  .station .dot{transition:transform .15s;transform-box:fill-box;transform-origin:center}
  .station:hover .dot,.station.active .dot{transform:scale(var(--dot-hover,1.7))}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  @media (max-width:640px){
    #logo{top:12px;left:12px;height:52px;min-width:0}
    #logo span{display:none}
    #legend{left:12px;bottom:12px;padding:8px 10px}
    #zoom{right:12px;bottom:12px}
    #panel{width:100%;top:auto;height:78%;border-left:0;border-top:3px solid var(--ink);transform:translateY(105%)}
  }
  [data-theme=dark]{--bg:#000;--ink:#fff;--paper:#000;--muted:#9a9a9a;--dim:#58595B}
  html{background:var(--bg)}
  .dot{fill:var(--ink)}
  .xdot{fill:var(--bg);stroke:var(--ink)}
  .train{fill:var(--bg)}
  #tools{position:fixed;right:20px;bottom:156px;z-index:5;display:flex;flex-direction:column;border:2px solid var(--ink);background:var(--paper)}
  #tools button{all:unset;cursor:pointer;width:40px;height:40px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:var(--ink)}
  #tools button+button{border-top:2px solid var(--ink)}
  #tools button:hover{background:var(--ink);color:var(--paper)}
  #tools button[aria-pressed=true]{background:var(--ink);color:var(--paper)}
  #gridlayer{display:none;pointer-events:none} svg.show-grid #gridlayer{display:inline}
  #gridpat .gl{fill:none;stroke:var(--ink);stroke-opacity:.09;stroke-width:1}
  #gridpat .gd{fill:var(--ink);fill-opacity:.28}
  #zoom button{color:var(--ink)}
  ::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}
  @media (max-width:640px){#tools{right:12px;bottom:148px}}
  /* UI boxes: black on the white map, white on the inverted map */
  #legend,#zoom,#tools,#xfbody,#card{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  #legend button{color:var(--paper)}
  #legend button:focus-visible{outline-color:var(--paper)}
  #zoom button,#tools button{color:var(--paper)}
  #zoom button+button,#tools button+button{border-top:1px solid color-mix(in srgb,var(--paper) 35%,transparent)}
  #zoom button:hover,#tools button:hover{background:var(--paper);color:var(--ink)}
  #tools button[aria-pressed=true]{background:var(--paper);color:var(--ink)}
  #xftoggle{background:var(--ink);color:var(--paper)}
  #xfbody label{color:color-mix(in srgb,var(--paper) 65%,transparent)}
  #xfbody output{color:var(--paper)}
  #xfbody output i{color:color-mix(in srgb,var(--paper) 55%,transparent)}
  #xfbody input{accent-color:var(--paper)}
  .xfrow button{border-color:var(--paper);color:var(--paper)}
  .xfrow button:hover{background:var(--paper);color:var(--ink)}
  #card .meta{color:color-mix(in srgb,var(--paper) 65%,transparent)}
  /* station popup (replaces the side panel) */
  #panel{position:fixed;top:0;left:0;right:auto;bottom:auto;width:300px;max-width:calc(100vw - 24px);height:auto;border:0;
    background:var(--ink);color:var(--paper);z-index:10;transform:none;opacity:0;pointer-events:none;transition:opacity .16s;display:flex;flex-direction:column}
  #panel.open{opacity:1;pointer-events:auto;transform:none}
  #panel .sign{height:auto;padding:12px 14px;background:transparent;color:var(--paper);box-shadow:none;border:0;border-bottom:1px solid color-mix(in srgb,var(--paper) 25%,transparent)}
  #panel .sign .name{font-size:17px}
  #panel .close{color:var(--paper);font-size:15px}
  #panel .body{padding:12px 14px;gap:10px;flex:none;overflow:visible}
  #panel h2{font-size:15px;line-height:1.4}
  #panel .info{color:var(--paper);grid-template-columns:52px 1fr;font-size:12px}
  #panel .info dt{color:color-mix(in srgb,var(--paper) 55%,transparent)}
  #panel a.ig{background:var(--paper);color:var(--ink);padding:11px 14px;font-size:13px}
  .xbtn{border-color:var(--paper);color:var(--paper);font-size:12px;padding:7px 9px}
  .xbtn:hover{background:var(--paper);color:var(--ink)}
  #panel .nav{border-top:1px solid color-mix(in srgb,var(--paper) 25%,transparent)}
  #panel .nav button{color:var(--paper);padding:10px 14px;font-size:12px}
  #panel .nav button+button{border-left:1px solid color-mix(in srgb,var(--paper) 25%,transparent)}
  #panel .nav small{color:color-mix(in srgb,var(--paper) 55%,transparent)}
  #panel .nav button:disabled,#panel .nav button:disabled small{color:color-mix(in srgb,var(--paper) 30%,transparent)}
  #xfbody .opts{display:grid;gap:8px;padding-bottom:12px;border-bottom:1px solid color-mix(in srgb,var(--paper) 25%,transparent)}
  #xfbody .tog{display:flex;align-items:center;gap:8px;margin:0;color:var(--paper);font-weight:700;font-size:12px;cursor:pointer}
  #xfbody .tog input{width:16px;height:16px;accent-color:var(--paper);margin:0}
  #xfbody .tog i{font-style:normal;font-weight:500;color:color-mix(in srgb,var(--paper) 55%,transparent)}
  #xfbody .tog.sub{padding-left:24px;font-weight:500}
  #xfbody .tog input:disabled+span{opacity:.4}
  .station{cursor:grab}
  .dragging-station,.dragging-station .station{cursor:grabbing}
  .station.snap .dot{transform:scale(2.2)}
  .station.snap .xdot{transform:scale(1.4)}
</style>
</head>

  </div>
  <div class="nav"><button id="pprev"><small>← 이전 역</small><span></span></button><button id="pnext"><small>다음 역 →</small><span></span></button></div>
</aside>

    let t0=0;const P=L.parent;
    if(P&&start.has(P)){const c=cumDist(P.P),from=c[P.idx[P.k]],at=c[P.idx[L.pk]],fwd=at>=from,sub=P.subs[fwd||P.subs.length<2?0:1],
      d=dur(P)[fwd||P.subs.length<2?0:1]||0,len=sub?sub._len:1;t0=start.get(P)+d*Math.pow(Math.min(1,Math.abs(at-from)/(len||1)),.9)+120}
    start.set(L,t0);growLine(L,t0);
  });
}
// ---------- loop ----------
let lt=performance.now();
function frame(t){
  const dt=Math.min(50,t-lt); lt=t;
  if(target)target(t);
  { const mv=sdrag&&sdrag.active?sdrag.moving:settle&&settle.moving;
    if(mv){const m=relax(mv); if(m>.05){geometry();draw();if(sdrag&&sdrag.snap&&sdrag.snap.g)sdrag.snap.g.classList.add('snap')}
      if(!sdrag&&settle&&(m<=.05||t-settle.t0>PULL.settleMs)){const mv2=settle.moving;settle=null;afterSettle(mv2)}} }
  stepTween(t);
  placePopup();
  if(!reduce) LINES.forEach(L=>{ if(!L.plen)return;
    L.tpos=(L.tpos+dt/(L.plen*DESIGN.train.speed))%2; const p=L.loop?L.tpos%1:(L.tpos<1?L.tpos:2-L.tpos);
    const a=L.path.getPointAtLength(p*L.plen), b=L.path.getPointAtLength(Math.min(L.plen,p*L.plen+1));
    const ang=Math.atan2(b.y-a.y,b.x-a.x)*180/Math.PI;
    L.train.setAttribute('transform',`translate(${a.x},${a.y}) rotate(${ang})`);
  });
  requestAnimationFrame(frame);
}


// ---------- replay & theme ----------
function replay(){
  if(reduce)return;
  const ghost=el('g',{style:'pointer-events:none'},world);
  [gL,gS,gB,gT].forEach(g=>[...g.childNodes].forEach(n=>ghost.appendChild(n)));
  ghost.animate([{opacity:1},{opacity:0}],{duration:DESIGN.motion.rebuildFadeMs,easing:'ease-out'}).onfinish=()=>ghost.remove();
  build(); refreshFocus(); setTimeout(intro,120);
  if(!follow){const v=fitView(all.map(s=>[s.x,s.y]),innerWidth>640?110:60);animateTo(v,900)}
}
// grid toggle (shows the invisible grid the stations sit on)
function setGrid(on){svg.classList.toggle('show-grid',on);$('#gridbtn').setAttribute('aria-pressed',on);try{localStorage.setItem('eee-grid',on?'1':'')}catch(e){}}
try{if(localStorage.getItem('eee-grid')==='1')setGrid(true)}catch(e){}
{const G=DESIGN.grid.unit,pt=$('#gridpat');pt.setAttribute('width',G);pt.setAttribute('height',G);pt.querySelector('.gl').setAttribute('d',`M${G} 0H0V${G}`)}
$('#gridbtn').onclick=()=>setGrid(!svg.classList.contains('show-grid'));
// ↻: a fresh random layout (start/end points, transfer stations, turns), saved so it survives a reload
$('#replay').onclick=()=>{sdrag=null;settle=null;tween=null;if(current)closePanel();generate(Math.random);savePos();replay()};
function setTheme(dark){document.documentElement.dataset.theme=dark?'dark':'';try{localStorage.setItem('eee-theme',dark?'dark':'')}catch(e){}}
try{if(localStorage.getItem('eee-theme')==='dark')setTheme(true)}catch(e){}
$('#theme').onclick=e=>{
  const dark=document.documentElement.dataset.theme!=='dark';
  const r=e.currentTarget.getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height/2;
  const R=Math.hypot(Math.max(x,innerWidth-x),Math.max(y,innerHeight-y));
  if(reduce||!document.startViewTransition){setTheme(dark);return}
  const vt=document.startViewTransition(()=>setTheme(dark));
  vt.ready.then(()=>document.documentElement.animate({clipPath:[`circle(0px at ${x}px ${y}px)`,`circle(${R}px at ${x}px ${y}px)`]},
    {duration:700,easing:'cubic-bezier(.65,0,.35,1)',pseudoElement:'::view-transition-new(root)'})).catch(()=>{});
};

// ---------- boot ----------
view=fitView(all.map(s=>[s.x,s.y]),90); apply(); intro(); requestAnimationFrame(frame);
function fromHash(){const m=location.hash.match(/#([A-Z]-\d+)$/); if(m){const s=all.find(x=>x.id===m[1]); if(s) setTimeout(()=>openStation(s,true),reduce?0:900)}}
fromHash(); addEventListener('hashchange',fromHash);
// closing the tab mid-tidy-up: save where the stations were heading, not where they happened to be
addEventListener('pagehide',()=>{if(tween){tween.plans.forEach(q=>{q.s.x=q.to[0];q.s.y=q.to[1]});tween=null}savePos()});
addEventListener('resize',()=>{if(follow)centerOn(follow,0,false);else if(!current){view=fitView(all.map(s=>[s.x,s.y]),90);apply()}});
</script>
</body>
