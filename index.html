/* -------------------------------------------------------------------------
   1. Tokens
   ------------------------------------------------------------------------- */
:root {
  /* --- typeface --- */
  --font-sign: "Albert Sans NYCTA", "NYCTA Hangul", system-ui, sans-serif; /* DEC-017, DEC-024, DEC-032 | - | [설계결정] substitute for TYPE-001 Standard Medium; Hangul companion */
  --font-weight-light: 600;                             /* DEC-017 | - | [설계결정] Medium equivalent (TYPE-002), dark type on white */
  --font-weight: var(--font-weight-light);              /* DEC-017, DEC-019 | - | [설계결정] current page weight (dark mode swaps it) */
  --font-weight-dark: 560;                              /* DEC-019 | - | [설계결정] irradiation compensation */
  --cap-em: 0.700;                                      /* DEC-017 | - | [변환] Albert Sans capHeight 700 / UPM 1000 */
  --ls: 0em;                                            /* DEC-024 | pdf p.13 | [변환] spacing now comes from the chart kerning in the font */
  --ws: -0.1485em;                                      /* DEC-018, TYPE-021 | pdf p.62,65 | [변환] word gap = 0.34 cap ink-to-ink (manual samples '& Brooklyn', 'Broadway Nassau') */
  --lsb-comp: 0.064em;                                  /* DEC-025 | pdf p.62,66 | [변환] straight-stem capitals (B D E F H I K L M N P R U): font side bearing − master inset; round letters end up ≈0.02em left (optical overshoot) */
  --ws-ko: -0.0737em;                                   /* DEC-033, DEC-018 | - | [변환] Hangul word gap ink-to-ink = 0.34 × 1.1 cap */
  --lsb-comp-ko: 0.0199em;                              /* DEC-033, DEC-025 | - | [변환] median Hangul left side bearing (after −1 unit tracking) */
  --trim-k: 0.35;                                       /* GRID-003 | - | [변환] (ascent+descent)/2 − (ascent − cap) of the web font */

  /* --- module (sign scale) --- */
  --module: clamp(40px, 10vw, 97.75px);                 /* DEC-001, DEC-002 | - | [변환] 1rem × 0.700 × 12 / 1.375 = 97.75px max */
  --in: calc(var(--module) / 12);                       /* GRID-002 | pdf p.9–11 | [변환] module = 12in */

  /* cap heights (TYPE-004: size = UPPER CASE X height) */
  --cap-l: calc(var(--in) * 9);                         /* TYPE-005 | pdf p.7–9 | [이미지판독] identification / Exit / Transfer */
  --cap-m: calc(var(--in) * 4.25);                      /* TYPE-006 | pdf p.7,8,10 | [이미지판독] directional */
  --cap-s: calc(var(--in) * 1.375);                     /* TYPE-007 | pdf p.7,8,11 | [이미지판독] informational */
  --fs-l: calc(var(--cap-l) / var(--cap-em));           /* TYPE-005 | - | [변환] cap / capEm */
  --fs-m: calc(var(--cap-m) / var(--cap-em));           /* TYPE-006 | - | [변환] cap / capEm */
  --fs-s: max(12px, calc(var(--cap-s) / var(--cap-em))); /* TYPE-007, DEC-016 | - | [변환] cap / capEm, 12px floor [설계결정] */

  /* space units (TYPE-026: 1 unit = cap / 36) — reference only; the pair matrix is applied inside the font (DEC-024) */
  --unit-l: calc(var(--cap-l) / 36);                    /* TYPE-026 | pdf p.104,116 | [이미지판독] */
  --unit-m: calc(var(--cap-m) / 36);                    /* TYPE-026 | pdf p.158 | [이미지판독] */
  --unit-s: calc(var(--cap-s) / 36);                    /* TYPE-026 | pdf p.174 | [이미지판독] */

  /* line heights (font-size units) = pitch / cap × capEm */
  --lh-g2: calc(5.625 / 4.25 * var(--cap-em));          /* GRID-006 | pdf p.10 | [변환] pitch 5 5/8in → 0.9265 */
  --lh-g1: calc(1.875 / 1.375 * var(--cap-em));         /* GRID-007 | pdf p.11 | [변환] pitch 1 7/8in → 0.9545 */
  --lh-body: 1.5;                                       /* DEC-020 | - | [설계결정] long-form text only */

  /* spacing */
  --space-margin: calc(var(--in) * 0.5);                /* GRID-003, GRID-004 | pdf p.9–11 | [이미지판독] ½in top/left */
  --space-gap-g1: calc(var(--in) * 0.5);                /* GRID-007 | pdf p.11 | [이미지판독] baseline → next cap line */
  --space-gap-g2: calc(var(--in) * 1.375);              /* GRID-006 | pdf p.10 | [이미지판독] */
  --space-disc-text: calc(var(--in) * 0.5);             /* GRID-009 | pdf p.11 | [이미지판독] */

  /* strokes */
  --stroke-band: calc(var(--in) * 1.625);               /* GRID-013 | pdf p.64 | [이미지판독] black band 1 5/8in */
  --stroke-divider: max(1px, calc(var(--in) * 0.125));  /* SIGN-023 | pdf p.88 | [확정] 1/8in divider line */

  /* discs */
  --disc-l: calc(var(--in) * 11);                       /* DISC-001, GRID-016 | pdf p.14,65 | [이미지판독] 11in in 12in module */
  --disc-m: calc(var(--in) * 5.5);                      /* DISC-001 | pdf p.14 | [이미지판독] */
  --disc-s: calc(var(--in) * 1.6875);                   /* DISC-001, GRID-008 | pdf p.11,14 | [이미지판독] 1 11/16in */
  --disc-glyph: 0.408;                                  /* DISC-004, DISC-007 | pdf p.15–40 | [이미지판독] glyph cap / D, median of 26 masters */

  /* --- document scale (DEC-002): body = Information tier at 1rem --- */
  --doc-in: calc(1rem * var(--cap-em) / 1.375);         /* DEC-002 | - | [변환] 1rem ↔ 1 3/8in cap → 1in ≈ 8.15px */
  --doc-fs-s: 1rem;                                     /* DEC-005 | - | [설계결정] */
  --doc-fs-m: clamp(1.75rem, 1rem + 3vw, calc(1rem * 4.25 / 1.375));  /* DEC-002, DEC-005 | - | [설계결정] max = TYPE-006 ratio 3.091rem */
  --doc-fs-l: clamp(2.5rem, 1rem + 7vw, calc(1rem * 9 / 1.375));      /* DEC-002, DEC-005 | - | [설계결정] max = TYPE-005 ratio 6.545rem */
  --doc-space-1: calc(var(--doc-in) * 0.5);             /* GRID-003 | - | [변환] ½in */
  --doc-space-2: calc(var(--doc-in) * 1.375);           /* GRID-006 | - | [변환] 1 3/8in */
  --doc-space-3: calc(var(--doc-in) * 1.875);           /* GRID-007 | - | [변환] 1 7/8in */
  --doc-space-4: calc(var(--doc-in) * 5.625);           /* GRID-006 | - | [변환] 5 5/8in */
  --doc-space-5: calc(var(--doc-in) * 12);              /* GRID-002 | - | [변환] 1 module */
  --doc-band: calc(var(--doc-in) * 1.625);              /* GRID-013 | - | [변환] band at document scale */
  --doc-rule: max(1px, calc(var(--doc-in) * 0.125));    /* SIGN-023 | - | [변환] 1/8in */

  /* --- colors (DEC-003: scan, paper-corrected) --- */
  --c-white:      #FFFFFF;                              /* COLOR-009 | pdf p.65 | [확정] */
  --c-black:      #000000;                              /* COLOR-009, DEC-003 | pdf p.65 | [설계결정] pure black, swatch photo distorted */
  --c-yellow:     #FFCE0E;                              /* COLOR-005 | pdf p.49 | [이미지판독] PMS 130 lines + PMS 109 Transfer */
  --c-orange:     #FF6E10;                              /* COLOR-005 | pdf p.50 | [이미지판독] PMS 165 */

<style>
/* ==========================================================================
   EEE map UI on the NYCTA design system (nycta-gsm). Tokens above come from vendor/nycta/nycta.css §0–1
   (build.py pastes them in); this block only maps them onto the map. Rule IDs refer to the nycta-gsm ledger.
   - Type: one weight (TYPE-002), sentence case (DONT-005), flush left, no faux bold (SIGN-002).
     Type = --font-sign: Albert Sans NYCTA + NYCTA Hangul (DEC-032), or the local Helvetica preview + its Hangul twin.
   - Korean text (:lang(ko), the whole page) follows DEC-033; English copy is marked lang="en".
   - Exact rectangles (DEC-009); the only circles are discs and stations.
   - UI chrome = reverse plates (DEC-031): field in the page text colour, ⅛in rule ½in below the top edge.
   ========================================================================== */
  :root{
    --font:var(--font-sign);                       /* DEC-017, DEC-032 (preview/helvetica.css overrides --font-sign) */
    --edge:20px;                                   /* [eee] distance of the UI from the screen edge */
    --ui-btn:40px;                                 /* [eee] tool / zoom button = square */
    --rp-gap:calc(var(--doc-in) * .5);             /* DEC-031 | ½in field above the rule */
    --rp-rule:max(1px, calc(var(--doc-in) * .125));/* DEC-031, SIGN-023 | ⅛in rule */
    --rp-top:calc(var(--rp-gap) * 2 + var(--rp-rule)); /* DEC-031 | ½ + ⅛ + ½in to the first cap line */
    --rp-side:calc(var(--doc-in) * .5);            /* GRID-003 | ½in side margin */
    /* [eee 설계결정] Hangul rises above the cap line and drops below the baseline, so Grid 1 (pitch 1⅞in, lh .95)
       makes Korean lines touch. Korean copy: lh 1.4, and block gap = Grid 2 gap 1⅜in instead of ½in. */
    --lh-ko:1.4;
    --gap-ko:calc(var(--doc-in) * 1.375);          /* GRID-006 gap */
    color-scheme:light;
  }
  /* ◐ dark = white↔black swap; disc glyph colours stay (DEC-019) */
  :root[data-theme=dark]{--fg:var(--c-white);--bg:var(--c-black);--font-weight:var(--font-weight-dark);color-scheme:dark}

  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;border-radius:0}   /* DEC-009 */
  html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:var(--font);font-weight:var(--font-weight);
    font-size:100%;line-height:var(--lh-g1);font-kerning:normal;font-synthesis:none;text-transform:none;-webkit-font-smoothing:antialiased}
  button{all:unset;cursor:pointer;box-sizing:border-box;font:inherit;color:inherit}
  /* DEC-033 Korean text: never break inside a word, Hangul word gap, first-glyph pull. lang="en" keeps the Latin values (DEC-018/025) */
  *{--lsb-pull:var(--lsb-comp)}
  :lang(ko){word-break:keep-all;line-break:strict;word-spacing:var(--ws-ko);--lsb-pull:var(--lsb-comp-ko)}
  :lang(en){word-spacing:var(--ws)}
  :focus:not(:focus-visible){outline:none}                                   /* DEC-008 */
  :focus-visible{outline:1px solid currentColor;outline-offset:2px}          /* DEC-008 minimal */
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

  /* ---- map ---- */
  #map{position:fixed;inset:0;width:100%;height:100%;cursor:grab;touch-action:none;user-select:none}
  #map.dragging{cursor:grabbing}
  .label{font-size:var(--label-size,13px);font-weight:var(--font-weight);fill:var(--fg);pointer-events:none}
  .hide-labels .label{display:none}
  /* DEC-036: butt ends (the run-on carries the strand past the end station), page-colour casing cuts crossings */
  .line-path,.line-case{fill:none;stroke-linecap:butt;stroke-linejoin:round;transition:opacity .2s}
  .line-case{stroke:var(--bg)}
  .station{cursor:grab}
  .station:focus{outline:none}
  .station:focus-visible .dot{outline:1px solid var(--fg);outline-offset:4px}
  .station .hit{fill:transparent}
  .dot{fill:var(--c-black)}                                      /* DEC-036 station = plain black circle, no letter; no dark-mode ring (it always sits on a line) */
  .xdot{fill:var(--bg);stroke:var(--fg)}  /* [eee] layout-made interchange, kept until the transfer decision */
  .train{fill:var(--bg)}
  .dim{opacity:.18}
  .station .dot{transition:transform .15s;transform-box:fill-box;transform-origin:center}
  .station:hover .dot,.station.active .dot{transform:scale(var(--dot-hover,1.7))}
  .station.snap .dot{transform:scale(2.2)}
  .station.snap .xdot{transform:scale(1.4)}
  .dragging-station,.dragging-station .station{cursor:grabbing}
  #gridlayer{display:none;pointer-events:none} svg.show-grid #gridlayer{display:inline}
  #gridpat .gl{fill:none;stroke:var(--fg);stroke-opacity:.09;stroke-width:1}
  #gridpat .gd{fill:var(--fg);fill-opacity:.28}
  ::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}

  /* ---- disc (line badge): DISC-001/004 — glyph cap = 0.408 D; yellow takes black type, every other colour white (DEC-004) ---- */
  .disc{--d:28px;display:inline-grid;place-items:center;flex:0 0 auto;width:var(--d);height:var(--d);border-radius:50%;
    background:var(--line,var(--c-black));color:var(--on,var(--c-white));font-size:calc(var(--d) * var(--disc-glyph) / var(--cap-em));
    line-height:1;text-align:center;white-space:nowrap;vertical-align:top;position:relative}
  /* glyph = baked outline (DEC-035): circle = background, glyph = ::after in the same box painted currentColor through
     --disc-mask (from the nycta block, picked by data-line), so circle and glyph never drift apart at any zoom.
     The text stays for screen readers, transparent; labels without an outline fall back to it. */
  .disc>span{display:block;color:var(--disc-text,inherit)}
  .disc::after{content:"";position:absolute;inset:0;background:currentColor;pointer-events:none;
    -webkit-mask:var(--disc-mask,linear-gradient(#0000 0 0)) center/100% 100% no-repeat;mask:var(--disc-mask,linear-gradient(#0000 0 0)) center/100% 100% no-repeat}
  /* inline disc beside 1rem copy (GRID-008, DEC-034): D = cap × 1 11/16 ÷ 1 3/8, no minimum size (DEC-021 20px floor retired).
     Centred on the parent cap height from geometry only; overhang (mb) never changes line spacing; text out of flow so the
     baseline is the margin edge. Same maths as nycta.css .disc--inline. */
  .disc--inline{--d:calc(1rem * var(--cap-em) * 1.6875 / 1.375);--disc-mb:.3;margin-block:calc(var(--d) * -1 * var(--disc-mb));
    vertical-align:calc(var(--d) * (1.375 / 1.6875 / 2 - .5 + var(--disc-mb)))}
  .disc--inline>span{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}

  /* ---- arrow: ARROW-005 path (symbol #nyarrow), ARROW-001 directions only ---- */
  .arrow{--d:calc(1em * var(--cap-em) * 1.6875 / 1.375);width:var(--d);height:var(--d);flex:0 0 auto;fill:currentColor;overflow:visible;
    vertical-align:calc(-1 * (var(--d) - 1em * var(--cap-em)) / 2)}   /* DEC-014 inline size, centred on the cap height */
  .arrow[data-dir=left]{transform:rotate(180deg)}

  /* ---- reverse plate (DEC-031): every UI box ---- */
  .rplate{--font-weight:var(--font-weight-dark);color:var(--bg);font-weight:var(--font-weight);
    background:linear-gradient(var(--bg),var(--bg)) 0 var(--rp-gap) / 100% var(--rp-rule) no-repeat, var(--fg)}
  :root[data-theme=dark] .rplate{--font-weight:var(--font-weight-light)}   /* black type on white: no irradiation compensation */

  /* logo: identification plate, name hung from the top-left margin (GRID-003/004) */
  #logo{position:fixed;top:var(--edge);left:var(--edge);z-index:5;display:flex;align-items:flex-start;gap:calc(var(--doc-in) * 1.375);
    padding:var(--rp-top) calc(var(--doc-in) * 1.375) calc(var(--doc-in) * 1.375) var(--rp-side)}
  #logo b{font-weight:inherit;font-size:1.75rem;line-height:1;margin-inline-start:calc(-1 * var(--lsb-pull))}   /* DEC-005 Directional tier (lower bound) */
  #logo span{font-size:max(12px, .75rem);line-height:var(--lh-g1)}

  /* legend: [disc] [day] [series], hierarchy by order, rows split by ⅛in rules */
  #legend{position:fixed;left:var(--edge);bottom:var(--edge);z-index:5;display:grid;padding:var(--rp-top) var(--rp-side) 0}
  #legend button{display:flex;align-items:center;gap:calc(var(--doc-in) * .5);padding:calc(var(--rp-side) * 1.5) var(--rp-side) calc(var(--rp-side) * 1.5) 0;line-height:var(--lh-ko)}
  #legend button+button{border-top:var(--rp-rule) solid currentColor}
  #legend .bs{display:flex;gap:2px}
  #legend .day{min-width:1.25em}

  /* tools & zoom: stacks of square buttons, ⅛in rules between, pressed / hover = reversed (DEC-007 active state) */
  #tools,#zoom{position:fixed;right:var(--edge);z-index:5;display:flex;flex-direction:column;padding-top:var(--rp-top)}
  #tools{bottom:calc(var(--edge) + 3 * var(--ui-btn) + var(--rp-top) + 16px)}
  #zoom{bottom:var(--edge)}
  #tools button,#zoom button{width:var(--ui-btn);height:var(--ui-btn);display:flex;align-items:center;justify-content:center;font-size:1.125rem;line-height:1}
  #zoom #zfit{font-size:max(12px, .75rem)}
  #tools button+button,#zoom button+button{border-top:var(--rp-rule) solid currentColor}
  #tools button:hover,#zoom button:hover,#tools button[aria-pressed=true]{background:var(--bg);color:var(--fg)}

  /* ---- station popup: DEC-031 information popup (Grid 1, lead disc, close as text link, no animation) ---- */
  #panel{--p-in:var(--doc-in);position:fixed;top:0;left:0;z-index:10;opacity:0;pointer-events:none;
    width:max-content;max-width:min(calc(var(--p-in) * 48), calc(100vw - 24px));            /* ≤ 4 ft */
    padding:var(--rp-top) var(--rp-side) calc(var(--p-in) * (.5 + .235 * 1.375));           /* bottom ½in below the descender guide */
    font-size:1rem;line-height:var(--lh-ko)}
  #panel.open{opacity:1;pointer-events:auto}
  #panel .body{display:flex;align-items:flex-start;gap:calc(var(--p-in) * .5)}              /* GRID-009 disc → text ½in */
  #pb .disc{--d:calc(1rem * (var(--cap-em) + var(--lh-ko)))}                               /* DEC-031 lead disc spans lines 1–2 (cap + one pitch, Korean pitch) */
  #panel .text{min-width:0;max-width:calc(var(--p-in) * 40)}
  #panel .text>*{--p-trim:calc((var(--trim-k) - var(--lh-ko) / 2) * 1em);margin:var(--p-trim) 0 var(--p-trim) calc(-1 * var(--lsb-pull))}   /* DEC-025, DEC-033 */
  #panel .text>*+*{margin-block-start:calc(var(--gap-ko) + var(--p-trim))}                  /* GRID-007 → [eee] Korean gap */
  @supports (text-box: trim-both cap alphabetic){#panel .text>*{--p-trim:0px;text-box:trim-both cap alphabetic}}
  #pxfer{display:grid;gap:calc(var(--gap-ko) / 2)} #pxfer:empty{display:none}
  #panel a,#panel button{color:inherit;text-decoration:underline;text-decoration-thickness:var(--rp-rule);text-underline-offset:.18em}  /* DEC-006 */
  #panel button:disabled{text-decoration:none;cursor:default}
  #panel .nav{display:flex;justify-content:space-between;gap:calc(var(--p-in) * 1.375)}      /* [eee] prev ← … → next on one row */
  #panel .nav button:disabled{visibility:hidden}                                            /* line end: keep the other button in place */
  #panel .nav button{display:flex;align-items:baseline;gap:.3em}   /* flex gaps: the underline stops between words */
  #panel small{font-size:inherit}

  @media (max-width:640px){
    :root{--edge:12px}
    #logo span{display:none}
    #tools{bottom:calc(var(--edge) + 3 * var(--ui-btn) + var(--rp-top) + 12px)}
  }
</style>
<script>/* 로컬 헬베티카 미리보기(nycta-gsm DEC-028). 절대 배포하지 않는다: preview/는 git 제외.
   file://·localhost에서만 preview/helvetica.css를 불러온다. ?font=web이면 배포 서체, ?font=helvetica면 강제로 미리보기.
   토큰 블록 뒤에 와야 미리보기 값(굵기·cap 비율)이 이긴다. 만들기: tools/preview_font.sh */
(function(){var q=location.search,local=location.protocol==='file:'||/^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname);
if(/[?&]font=helvetica\b/.test(q)||(local&&!/[?&]font=web\b/.test(q))){document.write('<link rel="stylesheet" href="preview/helvetica.css">');}})();</script>

svg.addEventListener('pointerdown',e=>{const hitSt=ptrs.size===0&&e.button===0?stationAt(e.clientX,e.clientY):null;svg.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,[e.clientX,e.clientY]);moved=false;if(hitSt)startStationDrag(hitSt,e);else sdrag=null;target=null;vel=[0,0];last=[e.clientX,e.clientY,performance.now()];if(ptrs.size===2){const [p,q]=[...ptrs.values()];pinch0={d:Math.hypot(p[0]-q[0],p[1]-q[1]),k:view.k}}});
svg.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId))return; const prev=ptrs.get(e.pointerId); ptrs.set(e.pointerId,[e.clientX,e.clientY]);
  if(sdrag&&ptrs.size===1){moveStationDrag(e);if(sdrag.active)moved=true;return}
  if(ptrs.size===2&&pinch0){sdrag=null;release();const [p,q]=[...ptrs.values()];const d=Math.hypot(p[0]-q[0],p[1]-q[1]);zoomAt((pinch0.k*d/pinch0.d)/view.k,(p[0]+q[0])/2,(p[1]+q[1])/2);moved=true;return}
  const dx=e.clientX-prev[0],dy=e.clientY-prev[1]; if(Math.abs(dx)+Math.abs(dy)>2){if(!moved)release();moved=true;svg.classList.add('dragging');unhover()}
  view.x+=dx;view.y+=dy;apply(); const now=performance.now(); vel=[dx/Math.max(1,now-last[2])*16,dy/Math.max(1,now-last[2])*16]; last=[e.clientX,e.clientY,now];
});
const up=e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)pinch0=null;svg.classList.remove('dragging');
  if(sdrag){const wasDrag=endStationDrag();if(wasDrag){moved=true;setTimeout(()=>moved=false,0);return}}
  if(moved&&!reduce&&ptrs.size===0){let v=[...vel];target=()=>{v[0]*=.92;v[1]*=.92;view.x+=v[0];view.y+=v[1];apply();if(Math.hypot(...v)<.3)target=null}}
  setTimeout(()=>moved=false,0)};
svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',up);
svg.addEventListener('wheel',e=>{e.preventDefault();release();
  const px=e.deltaMode===1?16:e.deltaMode===2?innerHeight:1;
  const mouseNotch=e.deltaMode!==0||(e.deltaX===0&&Math.abs(e.deltaY)>=100&&Number.isInteger(e.deltaY));
  if(e.ctrlKey||e.metaKey) zoomAt(Math.exp(-e.deltaY*px*.01),e.clientX,e.clientY);       // trackpad pinch / ⌘+wheel
  else if(mouseNotch) zoomAt(Math.exp(-e.deltaY*px*.0015),e.clientX,e.clientY);           // mouse wheel
  else {view.x-=e.deltaX*px;view.y-=e.deltaY*px;apply();unhover()}                        // two-finger pan
},{passive:false});
// Safari pinch
let gs=1;svg.addEventListener('gesturestart',e=>{e.preventDefault();gs=1});
svg.addEventListener('gesturechange',e=>{e.preventDefault();release();zoomAt(e.scale/gs,e.clientX||innerWidth/2,e.clientY||innerHeight/2);gs=e.scale});
svg.addEventListener('gestureend',e=>e.preventDefault());
$('#zin').onclick=()=>{release();zoomAt(1.4,innerWidth/2,innerHeight/2)};
$('#zout').onclick=()=>{release();zoomAt(1/1.4,innerWidth/2,innerHeight/2)};
$('#zfit').onclick=()=>{release();fitTo(all.map(s=>[s.x,s.y]))};

// ---------- hover / focus ----------
function focusLine(L){
  document.querySelectorAll('[data-line]').forEach(n=>{ if(n.closest('#legend'))return; n.classList.toggle('dim',!!L&&n.dataset.line!==L.key)});
  gS.querySelectorAll('.station').forEach(g=>{const s=stations.find(x=>x.g===g&&!x.owner)||stations.find(x=>x.g===g);const lines=[s.line,...(s.xfer||[]).map(x=>x.line)];g.classList.toggle('dim',!!L&&!lines.includes(L))});
  
}
// hover only highlights the station's line; the details live in the click popup (no hover summary card)
function hover(s,e){ if(ptrs.size)return; if(!current)focusLine(s.line)}
function moveCard(e){}
function unhover(){if(!current)focusLine(null)}

// ---------- panel ----------
let current=null; const panel=$('#panel');
function openStation(s,fromHash,keepView){
  current&&current.g.classList.remove('active'); current=s; s.g.classList.add('active');
  focusLine(s.line);
  const L=s.line;
  $('#pb').innerHTML=disc(L,s.b,'disc');
  const pt=$('#ptitle'); pt.textContent=s.t; pt.href=s.u;   // [eee] popup = title (links to Instagram), transfers, prev/next in one row (2026-11-18)
  const xr=$('#pxfer'); xr.innerHTML=''; (s.xfer||[]).forEach(x=>{const b=document.createElement('button');b.className='xbtn';b.innerHTML=`환승 ${disc(x.line,x.b)}`;b.setAttribute('aria-label',`환승: ${x.ser}`);b.onclick=()=>openStation(x);xr.appendChild(b)});
  const prev=L.st[s.i-1], next=L.st[s.i+1];
  const pb=$('#pprev'),nb=$('#pnext');
  pb.disabled=!prev; pb.onclick=()=>prev&&openStation(prev);
  nb.disabled=!next; nb.onclick=()=>next&&openStation(next);
  panel.classList.add('open'); panel.setAttribute('aria-hidden','false'); placePopup();
  if(!fromHash) try{history.replaceState(null,'','#'+s.id)}catch(e){}
  follow=s;
  if(!keepView) centerOn(s,DESIGN.motion.centerMs,true);
}
// ---------- camera lock: a clicked station stays centred until the user moves the map ----------
let follow=null;
function visibleCentre(){return innerWidth>640?[innerWidth/2,innerHeight/2]:[innerWidth/2,innerHeight*.3]}
// popup sits beside its station and moves with the map
function placePopup(){
  if(!current||!panel.classList.contains('open'))return;
  const s=current, sx=view.x+s.x*view.k, sy=view.y+s.y*view.k, w=panel.offsetWidth, h=panel.offsetHeight, m=12, gap=28;
  let x,y;
  if(innerWidth<=640){x=(innerWidth-w)/2;y=sy+gap}
  else{x=sx+gap; if(x+w>innerWidth-m)x=sx-gap-w; y=sy-h*.3}
  x=Math.max(m,Math.min(innerWidth-w-m,x)); y=Math.max(m,Math.min(innerHeight-h-m,y));
  panel.style.transform=`translate(${Math.round(x)}px,${Math.round(y)}px)`;
}
function centerOn(s,ms,zoomIn){
  const [cx,cy]=visibleCentre(), [z0,z1]=DESIGN.zoom.focus;
  const k=zoomIn?Math.min(z1,Math.max(view.k,z0)):view.k;
  const v={k,x:cx-s.x*k,y:cy-s.y*k}; if(ms)animateTo(v,ms); else {view=v;apply()}
}
function release(){follow=null;target=null}
function closePanel(){release();panel.classList.remove('open');panel.setAttribute('aria-hidden','true');current&&current.g.classList.remove('active');current=null;focusLine(null);try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}}
// no close button: Esc or a click on the empty map closes the popup
addEventListener('keydown',e=>{if(e.key==='Escape')closePanel()});
svg.addEventListener('click',e=>{
  if(moved)return;
  const hit=document.elementFromPoint(e.clientX,e.clientY), g=hit&&hit.closest&&hit.closest('.station');
  if(g){const s=stations.find(x=>x.g===g&&!x.owner)||stations.find(x=>x.g===g); if(s){openStation(s);return}}
  if(current)closePanel();
});

// ---------- growth animation ----------
const SPEED=DESIGN.motion.growPxPerMs;
function cumDist(P){const c=[0];for(let i=1;i<P.length;i++)c.push(c[i-1]+Math.hypot(P[i][0]-P[i-1][0],P[i][1]-P[i-1][1]));return c}
function popStation(s,at){if(!s.g||s.g._popped===at)return;s.g._popped=at;const X=s.vx??s.x,Y=s.vy??s.y;
  s.g.animate([{opacity:0,transform:`translate(${X}px,${Y}px) scale(.2)`},{opacity:1,transform:`translate(${X}px,${Y}px) scale(1.3)`,offset:.7},{opacity:1,transform:`translate(${X}px,${Y}px) scale(1)`}],{duration:DESIGN.motion.popMs,delay:at,easing:'ease-out',fill:'backwards'})}
function growLine(L,start){
  let end=start;
  L.subs.forEach((p,si)=>{
    const len=p._len,dur=Math.min(1600,Math.max(250,len/SPEED));
    [p,p._case].forEach(n=>{n.style.strokeDasharray=len;
      n.animate([{strokeDashoffset:len},{strokeDashoffset:0}],{duration:dur,delay:start,easing:'cubic-bezier(.35,0,.25,1)',fill:'backwards'})});
    // stations along this sub-path
    p._seq.forEach((s,i)=>{ if(s.owner)return; popStation(s,start+dur*Math.pow(Math.max(0,Math.min(1,p._sd[i]/(len||1))),.9)) });
    end=Math.max(end,start+dur);
  });
  [...gB.querySelectorAll(`[data-line="${L.key}"]`),L.train].forEach(n=>n&&n.animate([{opacity:0},{opacity:1}],{duration:300,delay:end,fill:'backwards'}));
  return end;
}
function intro(){
  if(reduce)return;
  // a line starts growing when its parent line's growth reaches the transfer
  const start=new Map(),dur=L=>L.subs.map(p=>Math.min(1600,Math.max(250,p._len/SPEED)));
  const order=[],add=L=>{if(order.includes(L))return;order.push(L);LINES.forEach(C=>{if(C.parent===L)add(C)})};
  add(main);LINES.forEach(L=>{if(!L.lead)add(L)});LINES.forEach(add);   // a parent always starts before its children
  order.forEach(L=>{
    let t0=0;const P=L.parent;
    if(P&&start.has(P)){const c=cumDist(P.P),from=c[P.idx[P.k]],at=c[P.idx[L.pk]],fwd=at>=from,sub=P.subs[fwd||P.subs.length<2?0:1],
      d=dur(P)[fwd||P.subs.length<2?0:1]||0,len=sub?sub._len:1;t0=start.get(P)+d*Math.pow(Math.min(1,Math.abs(at-from)/(len||1)),.9)+120}
    start.set(L,t0);growLine(L,t0);
  });
}
// ---------- loop ----------
let lt=performance.now();
function frame(t){
  const dt=Math.min(50,t-lt); lt=t;
  if(target)target(t);
  { const mv=sdrag&&sdrag.active?sdrag.moving:settle&&settle.moving;
    if(mv){const m=relax(mv); if(m>.05){geometry();draw();if(sdrag&&sdrag.snap&&sdrag.snap.g)sdrag.snap.g.classList.add('snap')}
      if(!sdrag&&settle&&(m<=.05||t-settle.t0>PULL.settleMs)){const mv2=settle.moving;settle=null;afterSettle(mv2)}} }
  stepTween(t);
  placePopup();
  if(!reduce) LINES.forEach(L=>{ if(!L.plen)return;
    L.tpos=(L.tpos+dt/(L.plen*DESIGN.train.speed))%2; const p=L.loop?L.tpos%1:(L.tpos<1?L.tpos:2-L.tpos);
    const a=L.path.getPointAtLength(p*L.plen), b=L.path.getPointAtLength(Math.min(L.plen,p*L.plen+1));
    const ang=Math.atan2(b.y-a.y,b.x-a.x)*180/Math.PI;
    L.train.setAttribute('transform',`translate(${a.x},${a.y}) rotate(${ang})`);
  });
  requestAnimationFrame(frame);
}


// ---------- replay & theme ----------
function replay(){
  if(reduce)return;
  const ghost=el('g',{style:'pointer-events:none'},world);
  [gL,gS,gB,gT].forEach(g=>[...g.childNodes].forEach(n=>ghost.appendChild(n)));
  ghost.animate([{opacity:1},{opacity:0}],{duration:DESIGN.motion.rebuildFadeMs,easing:'ease-out'}).onfinish=()=>ghost.remove();
  build(); refreshFocus(); setTimeout(intro,120);
  if(!follow){const v=fitView(all.map(s=>[s.x,s.y]),innerWidth>640?110:60);animateTo(v,900)}
}
// grid toggle (shows the invisible grid the stations sit on)
function setGrid(on){svg.classList.toggle('show-grid',on);$('#gridbtn').setAttribute('aria-pressed',on);try{localStorage.setItem('eee-grid',on?'1':'')}catch(e){}}
try{if(localStorage.getItem('eee-grid')==='1')setGrid(true)}catch(e){}
{const G=DESIGN.grid.unit,pt=$('#gridpat');pt.setAttribute('width',G);pt.setAttribute('height',G);pt.querySelector('.gl').setAttribute('d',`M${G} 0H0V${G}`)}
$('#gridbtn').onclick=()=>setGrid(!svg.classList.contains('show-grid'));
// ↻: a fresh random layout (start/end points, transfer stations, turns), saved so it survives a reload
$('#replay').onclick=()=>{sdrag=null;settle=null;tween=null;if(current)closePanel();generate(Math.random);savePos();replay()};
function setTheme(dark){document.documentElement.dataset.theme=dark?'dark':'';try{localStorage.setItem('eee-theme',dark?'dark':'')}catch(e){}}
try{if(localStorage.getItem('eee-theme')==='dark')setTheme(true)}catch(e){}
$('#theme').onclick=e=>{
  const dark=document.documentElement.dataset.theme!=='dark';
  const r=e.currentTarget.getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height/2;
  const R=Math.hypot(Math.max(x,innerWidth-x),Math.max(y,innerHeight-y));
  if(reduce||!document.startViewTransition){setTheme(dark);return}
  const vt=document.startViewTransition(()=>setTheme(dark));
  vt.ready.then(()=>document.documentElement.animate({clipPath:[`circle(0px at ${x}px ${y}px)`,`circle(${R}px at ${x}px ${y}px)`]},
    {duration:700,easing:'cubic-bezier(.65,0,.35,1)',pseudoElement:'::view-transition-new(root)'})).catch(()=>{});
};

// ---------- boot ----------
view=fitView(all.map(s=>[s.x,s.y]),90); apply(); intro(); requestAnimationFrame(frame);
function fromHash(){const m=location.hash.match(/#([A-Z]-\d+)$/); if(m){const s=stations.find(x=>x.id===m[1]); if(s) setTimeout(()=>openStation(s,true),reduce?0:900)}}
fromHash(); addEventListener('hashchange',fromHash);
// closing the tab mid-tidy-up: save where the stations were heading, not where they happened to be
addEventListener('pagehide',()=>{if(tween){tween.plans.forEach(q=>{q.s.x=q.to[0];q.s.y=q.to[1]});tween=null}savePos()});
addEventListener('resize',()=>{if(follow)centerOn(follow,0,false);else if(!current){view=fitView(all.map(s=>[s.x,s.y]),90);apply()}});
</script>
