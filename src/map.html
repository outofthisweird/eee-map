<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>EEE — Map</title>
<style>
/*__NYCTA__*/
</style>
<style>
/* ==========================================================================
   EEE map UI on the NYCTA design system (nycta-gsm). Tokens above come from vendor/nycta/nycta.css §0–1
   (build.py pastes them in); this block only maps them onto the map. Rule IDs refer to the nycta-gsm ledger.
   - Type: one weight (TYPE-002), sentence case (DONT-005), flush left, no faux bold (SIGN-002).
     Type = --font-sign: Albert Sans NYCTA + NYCTA Hangul (DEC-032), or the local Helvetica preview + its Hangul twin.
   - Korean text (:lang(ko), the whole page) follows DEC-033; English copy is marked lang="en".
   - Exact rectangles (DEC-009); the only circles are discs and stations.
   - UI chrome = reverse plates (DEC-031): field in the page text colour, ⅛in rule ½in below the top edge.
   ========================================================================== */
  :root{
    --font:var(--font-sign);                       /* DEC-017, DEC-032 (preview/helvetica.css overrides --font-sign) */
    --edge:20px;                                   /* [eee] distance of the UI from the screen edge */
    /* [eee] iPhone (2026-11-21 사용자 보고: 읽기 판 위 띠에서 노선이 위에서 잘려 보임): the page covers the whole screen (viewport-fit=cover),
       so the map runs on under the status bar; the UI keeps clear of it by the safe-area insets (0 elsewhere) */
    --sa-t:env(safe-area-inset-top, 0px);--sa-r:env(safe-area-inset-right, 0px);--sa-b:env(safe-area-inset-bottom, 0px);--sa-l:env(safe-area-inset-left, 0px);
    --ui-btn:40px;                                 /* [eee] tool / zoom button = square */
    --rp-gap:calc(var(--doc-in) * .5);             /* DEC-031 | ½in field above the rule */
    --rp-rule:max(1px, calc(var(--doc-in) * .125));/* DEC-031, SIGN-023 | ⅛in rule */
    --rp-top:calc(var(--rp-gap) * 2 + var(--rp-rule)); /* DEC-031 | ½ + ⅛ + ½in to the first cap line */
    --rp-side:calc(var(--doc-in) * .5);            /* GRID-003 | ½in side margin */
    --ft:calc(var(--doc-in) * 12);                 /* GRID-002 | 1 ft module = 12in (≈ 100px) */
    /* [eee 설계결정] Hangul rises above the cap line and drops below the baseline, so Grid 1 (pitch 1⅞in, lh .95)
       makes Korean lines touch. Korean copy: lh 1.4, and block gap = Grid 2 gap 1⅜in instead of ½in. */
    --lh-ko:1.4;
    --gap-ko:calc(var(--doc-in) * 1.375);          /* GRID-006 gap */
    color-scheme:light;
  }
  /* ◐ dark = white↔black swap; disc glyph colours stay (DEC-019) */
  /* English version (the 한/En button sets <html lang="en">; DEC-033 rules switch off with :lang(ko)): Latin lines keep
     Grid 1, so the Hangul line height falls back to it. [eee] The block gap stays 1⅜in in both languages: at ½in the
     popup's transfer row runs into the title's underline. */
  :root:lang(en){--lh-ko:var(--lh-g1)}
  :root[data-theme=dark]{--fg:var(--c-white);--bg:var(--c-black);--font-weight:var(--font-weight-dark);color-scheme:dark}

  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;border-radius:0}   /* DEC-009 */
  html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:var(--font);font-weight:var(--font-weight);
    font-size:100%;line-height:var(--lh-g1);font-kerning:normal;font-synthesis:none;text-transform:none;-webkit-font-smoothing:antialiased}
  button{all:unset;cursor:var(--cur-ui,pointer);box-sizing:border-box;font:inherit;color:inherit}
  /* DEC-033 Korean text: never break inside a word, Hangul word gap, first-glyph pull. lang="en" keeps the Latin values (DEC-018/025) */
  *{--lsb-pull:var(--lsb-comp)}
  :lang(ko){word-break:keep-all;line-break:strict;word-spacing:var(--ws-ko);--lsb-pull:var(--lsb-comp-ko)}
  :lang(en){word-spacing:var(--ws)}
  :focus:not(:focus-visible){outline:none}                                   /* DEC-008 */
  :focus-visible{outline:1px solid currentColor;outline-offset:2px}          /* DEC-008 minimal */
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

  /* ---- map ---- */
  #map{position:fixed;inset:0;width:100%;height:100%;cursor:var(--cur-map,grab);touch-action:none;user-select:none}
  #map.dragging{cursor:var(--cur-pan,grabbing)}
  /* [eee] trains live on their own layer above the map (2026-11-19): they never stop, and inside #map they made the
     DEC-038 ink-edge filter run every frame. What #map draws above the trains (stations, names) is repeated here,
     clipped to the trains (#trainclip), so the order on screen stays lines → trains → stations. */
  #mapfx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
  .label{font-size:var(--label-size,13px);font-weight:var(--font-weight);fill:var(--fg);pointer-events:none}
  .hide-labels .label:not(.lm){display:none}
  .lm{visibility:hidden}                         /* the name-width ruler (labelWidth) */
  /* DEC-036: butt ends (the run-on carries the strand past the end station), page-colour casing cuts crossings */
  .line-path,.line-case{fill:none;stroke-linecap:butt;stroke-linejoin:round;transition:opacity .2s}
  .line-case{stroke:var(--bg)}
  .station{cursor:var(--cur-station,grab)}
  .station:focus{outline:none}
  .station:focus-visible .dot{outline:1px solid var(--fg);outline-offset:4px}
  .station .hit{fill:transparent}
  .dot{fill:var(--c-black)}                                      /* DEC-036 station = plain black circle, no letter; no dark-mode ring (it always sits on a line) */
  .xdot{fill:var(--bg);stroke:var(--fg)}  /* [eee] layout-made interchange, kept until the transfer decision */
  .train{fill:var(--bg)}
  .dim{opacity:.18}
  /* [eee] next stop under construction (2026-11-20): dashed strand past the newest station, an open dashed station */
  .next-path{stroke-linecap:butt}
  .station .gdot{fill:var(--bg);stroke:var(--fg);stroke-width:2;stroke-dasharray:3 2.4}
  .station.ghost{cursor:var(--cur-ui,pointer)}
  .station .dot{transition:transform .15s;transform-box:fill-box;transform-origin:center}
  .station:hover .dot,.station.active .dot{transform:scale(var(--dot-hover,1.7))}
  .station.snap .dot{transform:scale(2.2)}
  .station.snap .xdot{transform:scale(1.4)}
  .dragging-station,.dragging-station .station{cursor:var(--cur-hold,grabbing)}
  #panel a{cursor:var(--cur-ui,pointer)}
  #gridlayer{display:none;pointer-events:none} svg.show-grid #gridlayer{display:inline}
  #gridpat .gl{fill:none;stroke:var(--fg);stroke-opacity:.09;stroke-width:1}
  #gridpat .gd{fill:var(--fg);fill-opacity:.28}
  ::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}
  @property --here{syntax:'<length>';inherits:true;initial-value:16px}   /* [eee] reading plate: see #reader */
  /* [eee] ◐ (2026-11-19): during the circle the page is a still picture of the old theme. So that it doesn't look frozen,
     the trains layer is its own live layer above the circle (only its new state, nothing to cross-fade).
     (Chrome sends every pointer event to <html> while the transition runs; pointer-events:none on ::view-transition
     doesn't change that, so the 0.7s stays non-interactive.) */
  #mapfx{view-transition-name:eee-fx}
  ::view-transition-group(eee-fx),::view-transition-new(eee-fx){animation:none}
  ::view-transition-old(eee-fx){display:none}

  /* ---- disc (line badge): DISC-001/004 — glyph cap = 0.408 D; yellow takes black type, every other colour white (DEC-004) ---- */
  .disc{--d:28px;display:inline-grid;place-items:center;flex:0 0 auto;width:var(--d);height:var(--d);border-radius:50%;
    background:var(--line,var(--c-black));color:var(--on,var(--c-white));font-size:calc(var(--d) * var(--disc-glyph) / var(--cap-em));
    line-height:1;text-align:center;white-space:nowrap;vertical-align:top;position:relative}
  /* glyph = baked outline (DEC-035): circle = background, glyph = ::after in the same box painted currentColor through
     --disc-mask (from the nycta block, picked by data-line), so circle and glyph never drift apart at any zoom.
     The text stays for screen readers, transparent; labels without an outline fall back to it. */
  .disc>span{display:block;color:var(--disc-text,inherit)}
  .disc::after{content:"";position:absolute;inset:0;background:currentColor;pointer-events:none;
    -webkit-mask:var(--disc-mask,linear-gradient(#0000 0 0)) center/100% 100% no-repeat;mask:var(--disc-mask,linear-gradient(#0000 0 0)) center/100% 100% no-repeat}
  /* inline disc beside 1rem copy (GRID-008, DEC-034): D = cap × 1 11/16 ÷ 1 3/8, no minimum size (DEC-021 20px floor retired).
     Centred on the parent cap height from geometry only; overhang (mb) never changes line spacing; text out of flow so the
     baseline is the margin edge. Same maths as nycta.css .disc--inline. */
  .disc--inline{--d:calc(1rem * var(--cap-em) * 1.6875 / 1.375);--disc-mb:.3;margin-block:calc(var(--d) * -1 * var(--disc-mb));
    vertical-align:calc(var(--d) * (1.375 / 1.6875 / 2 - .5 + var(--disc-mb)))}
  .disc--inline>span{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}

  /* ---- arrow: ARROW-005 path (symbol #nyarrow), ARROW-001 directions only ---- */
  .arrow{--d:calc(1em * var(--cap-em) * 1.6875 / 1.375);width:var(--d);height:var(--d);flex:0 0 auto;fill:currentColor;overflow:visible;
    vertical-align:calc(-1 * (var(--d) - 1em * var(--cap-em)) / 2)}   /* DEC-014 inline size, centred on the cap height */
  .arrow[data-dir=left]{transform:rotate(180deg)}

  /* ---- reverse plate (DEC-031): every UI box ---- */
  .rplate{--font-weight:var(--font-weight-dark);color:var(--bg);font-weight:var(--font-weight);
    background:linear-gradient(var(--bg),var(--bg)) 0 var(--rp-gap) / 100% var(--rp-rule) no-repeat, var(--fg)}
  :root[data-theme=dark] .rplate{--font-weight:var(--font-weight-light)}   /* black type on white: no irradiation compensation */
  :root[data-print] .rplate{filter:var(--print-filter)}                   /* nycta DEC-038 ink edge on eee's plates (nycta names them .plate/.popup) */
  /* [eee] the map's ink edge is its own filter, #eee-ink (2026-11-19, phones): the same displacement as nycta's #nycta-ink,
     but (1) its region is the screen in px, not a % of the box: WebKit sized nycta's by the map content, which zoomed in
     outgrew its filter limit and the whole map vanished; (2) its noise is a tile drawn once (inkNoise()), not feTurbulence
     every time: about 3× cheaper in WebKit. On in dark mode too (nycta DEC-038 since 9815439); off where nycta's layer is off
     (high contrast, forced colours, print). */
  :root[data-print] #map{filter:url(#eee-ink)}
  @media (prefers-contrast:more),(forced-colors:active),print{:root[data-print] #map{filter:none}}

  /* [eee] logo, legend and popup are standard module plates (GRID-012, SIGN-012): fitPlates() picks the shortest of
     1/2/4/6/8 ft that leaves ≥ 1in beside the copy (DEC-030 room), 1 ft high (whole feet if the copy needs more).
     Copy hangs from the top-left margin (GRID-003/004); the extra room stays empty at the bottom right. DESIGN.plate */

  /* logo: directional plate, Grid 2 (GRID-006, TYPE-006): two lines of 4¼in caps, pitch 5⅝in, hung from the top-left margin.
     [eee] the reverse-plate band (½ + ⅛in) comes out of GRID-006's 1⅝in bottom: 1⅛ + 4¼ + 1⅜ + 4¼ + 1in (descender guide, GRID-011) = 12in */
  #logo{position:fixed;top:calc(var(--edge) + var(--sa-t));left:calc(var(--edge) + var(--sa-l));z-index:5;
    --l-cap:4.25;--l-lh:var(--lh-g2);font-size:calc(var(--doc-in) * var(--l-cap) / var(--cap-em));line-height:var(--l-lh);
    padding:var(--rp-top) var(--rp-side) calc(var(--doc-in) * var(--l-cap) * .235) var(--rp-side)}
  #logo p{--l-trim:calc((var(--trim-k) - var(--l-lh) / 2) * 1em);margin:var(--l-trim) 0 var(--l-trim) calc(-1 * var(--lsb-pull));white-space:nowrap}   /* DEC-025 */
  @supports (text-box: trim-both cap alphabetic){#logo p{--l-trim:0px;text-box:trim-both cap alphabetic}}

  /* legend: [disc] [series], hierarchy by order (no weekday since 2026-11-21, 사용자 요청) */
  /* [eee] informational plate (TYPE-007): 1⅜in caps, discs inline (DEC-034); no rules between rows. Bottom ½in below the descender guide, like DEC-031.
     [eee 설계결정 2026-11-21] six rows (G added) at Grid 1's 1⅞in pitch came to 12.7in, so the plate grew to 2 ft. The legend's pitch is
     1.7in instead (gap ½ → .325in): 1⅛ (band) + 1⅜ + 5 × 1.7 + .82 (descender + ½) = 11.8in, one 1 ft module (user approved) */
  #legend{position:fixed;left:calc(var(--edge) + var(--sa-l));bottom:calc(var(--edge) + var(--sa-b));z-index:5;display:block;
    --l-lh:calc(1.7 / 1.375 * var(--cap-em));line-height:var(--l-lh);
    --l-trim:calc((var(--trim-k) - var(--l-lh) / 2) * 1em);
    padding:calc(var(--rp-top) + var(--l-trim)) var(--rp-side) calc(var(--doc-in) * (.5 + .235 * 1.375) + var(--l-trim))}
  @supports (text-box: trim-both cap alphabetic){#legend{--l-trim:0px}   /* trim on the rows: a button trims its own lines */
    #legend button:first-child{text-box:trim-start cap alphabetic} #legend button:last-child{text-box:trim-end cap alphabetic}}
  #legend button{display:block;white-space:nowrap;margin-inline-start:calc(-1 * var(--lsb-pull))}
  #legend .bs{margin-inline-end:calc(var(--doc-in) * .5)}                                 /* GRID-009 disc → text ½in */
  #legend .bs .disc+.disc{margin-inline-start:2px}

  /* tools & zoom: stacks of square buttons, ⅛in rules between, pressed / hover = reversed (DEC-007 active state) */
  /* [test] snap strength slider: local (file://, localhost) or ?tune only, never on the public site by default */
  #snaptune{position:fixed;top:calc(var(--edge) + var(--sa-t));left:50%;transform:translateX(-50%);z-index:6;padding:calc(var(--rp-top) + 6px) 12px 6px;font-size:max(12px,.75rem)}
  #snaptune label{display:flex;align-items:center;gap:8px}
  #snaptune input{width:160px;accent-color:currentColor}
  #snaptune output{min-width:2.5em;font-variant-numeric:tabular-nums}
  #snaptune{display:flex;gap:16px}
  #snaptune[hidden]{display:none}
  #snaptune select{font:inherit;color:inherit;background:transparent;border:0;border-bottom:var(--rp-rule) solid currentColor;padding:0 2px}
  #snaptune option{color:#000}
  /* [test] arrow cursor: one SVG that follows the pointer and turns to face the map centre (CURSOR, arrow mode) */
  html.cur-dom,html.cur-dom *{cursor:none!important}
  #curarrow{position:fixed;left:0;top:0;z-index:100;pointer-events:none;transform-origin:0 0;width:var(--cur-len);height:var(--cur-len);overflow:visible;
    fill:var(--fg);stroke:var(--bg);stroke-width:1.5px;stroke-linejoin:miter;paint-order:stroke;will-change:transform}
  #curarrow path{vector-effect:non-scaling-stroke}
  #curarrow.inv{fill:var(--bg);stroke:var(--fg)}
  #curarrow[hidden]{display:none}
  #tools,#zoom{position:fixed;right:calc(var(--edge) + var(--sa-r));z-index:5;display:flex;flex-direction:column;padding-top:var(--rp-top)}
  #tools{bottom:calc(var(--edge) + var(--sa-b) + 3 * var(--ui-btn) + var(--rp-top) + 16px)}
  #zoom{bottom:calc(var(--edge) + var(--sa-b))}
  #tools button,#zoom button{width:var(--ui-btn);height:var(--ui-btn);display:flex;align-items:center;justify-content:center;font-size:1.125rem;line-height:1}
  #zoom #zfit,#tools #langbtn{font-size:max(12px, .75rem)}
  #tools button+button,#zoom button+button{border-top:var(--rp-rule) solid currentColor}
  #tools button:hover,#zoom button:hover,#tools button[aria-pressed=true]{background:var(--bg);color:var(--fg)}

  /* ---- station popup: DEC-031 information popup (Grid 1, lead disc, close as text link, no animation) ---- */
  /* [eee] desktop popup is a bigger plate (2026-11-19 사용자 요청: 글자가 작다): the whole sign scales by --p-scale (type, margins,
     rule, disc, 1 ft module), so it stays a Grid 1 information plate, just larger. Phones keep 1 (DESIGN-free, CSS only). */
  #panel{--p-scale:1.5;--p-in:calc(var(--doc-in) * var(--p-scale));--p-fs:calc(1rem * var(--p-scale));
    --rp-gap:calc(var(--p-in) * .5);--rp-rule:max(1px, calc(var(--p-in) * .125));--rp-top:calc(var(--rp-gap) * 2 + var(--rp-rule));
    --rp-side:calc(var(--p-in) * .5);--ft:calc(var(--p-in) * 12);position:fixed;top:0;left:0;z-index:10;opacity:0;pointer-events:none;
    width:max-content;max-width:min(calc(var(--doc-in) * 48), calc(100vw - 24px));          /* ≤ 4 ft at page scale */
    padding:var(--rp-top) var(--rp-side) calc(var(--p-in) * (.5 + .235 * 1.375));           /* bottom ½in below the descender guide */
    font-size:var(--p-fs);line-height:var(--lh-g1)}                                                /* [eee] Grid 1 pitch in Korean too, like the legend (2026-11-19) */
  #panel.open{opacity:1;pointer-events:auto}
  #panel .body{display:flex;align-items:flex-start;gap:calc(var(--p-in) * .5)}              /* GRID-009 disc → text ½in */
  #pb .disc{--d:calc(var(--p-fs) * (var(--cap-em) + var(--lh-g1)))}                               /* DEC-031 lead disc spans lines 1–2 (cap + one pitch) */
  #panel .text{flex:1 1 auto;min-width:0;max-width:calc(var(--doc-in) * 40)}               /* longest line; fitPopup() shrinks to it.
     [eee] the wrap width stays 40in at page scale while the plate grows (2026-11-19 사용자 요청: 커진 만큼 폭만 좁게) */
  #panel .text>*{--p-trim:calc((var(--trim-k) - var(--lh-g1) / 2) * 1em);margin:var(--p-trim) 0 var(--p-trim) calc(-1 * var(--lsb-pull))}   /* DEC-025, DEC-033 */
  #panel .text>*+*{margin-block-start:calc(var(--gap-ko) + var(--p-trim))}                  /* GRID-007 → [eee] Korean gap */
  @supports (text-box: trim-both cap alphabetic){#panel .text>*{--p-trim:0px;text-box:trim-both cap alphabetic}}
  /* [eee] one block of text (2026-11-19): 역이름ⓡ (the transfer station's name, 2026-11-19) at the start, the summary, → 닫기 at the end */
  #panel .disc--inline{--d:calc(var(--p-fs) * var(--cap-em) * 1.6875 / 1.375)}           /* DEC-034 at the popup's size */
  #pxfer .xbtn{white-space:nowrap}                                                         /* no extra space: disc → summary → arrow (2026-11-19) */
  #panel .pclose{white-space:nowrap}
  #panel a,#panel button{color:inherit;text-decoration:underline;text-decoration-thickness:var(--rp-rule);text-underline-offset:.18em}  /* DEC-006 */
  #panel #psum{text-decoration:none}                                                       /* [eee] the summary is the Instagram link, no underline (2026-11-19) */
  .arrow[data-dir=down-left]{transform:rotate(135deg)}   /* [eee] ↙ 돌아가기: not one of the manual's directions (ARROW-001/006), user's pick, same as posts/post.css */

  /* ---- [eee] reading plate (2026-11-21 사용자 요청: 웹 연재(G) 팝업의 요약을 누르면 페이지를 넘기지 않고 팝업 판이 읽기 판으로 커진다) ----
     Layout from lab/post-d.html ("팝업처럼"): the same reverse plate (DEC-031: ½in field, ⅛in rule, ½in to the first cap), grown into a
     wide plate in the middle of the screen; the map stays behind it (a few strands and the current station show beside it, the
     camera puts the station just left of the title). Inside: title (G disc + title, direction size), the copy, and the end line
     [← (G) 이전 글] [(G) 다음 글 →] [돌아가기 ↙] flowing like one paragraph (사용자 취향: no ellipsis, no per-item breaks, no underline).
     The plate's own inch comes from the copy: copy = information size (cap 1⅜in), so the band, margins and rule scale with it.
     Width hugs the copy: ½in left + ~34em + DEC-030's ≥ 1in room on the right. It scrolls inside; the band stays on top. */
  #reader{display:none}
  /* closing: the blank plate that shrinks back into the popup (exitReading); its band at the popup's scale */
  .rghost{position:fixed;left:0;top:0;z-index:11;pointer-events:none;--rp-gap:calc(var(--doc-in) * .75);--rp-rule:max(1px, calc(var(--doc-in) * .1875))}
  @media (max-width:640px){.rghost{--rp-gap:calc(var(--doc-in) * .5);--rp-rule:max(1px, calc(var(--doc-in) * .125))}}
  #panel.hold{visibility:hidden}
  #panel.reading{--r-fs:clamp(17px, 12px + .55vw, 20px);--p-fs:var(--r-fs);--p-in:calc(var(--r-fs) * var(--cap-em) / 1.375);
    --r-room:calc(var(--p-in) * 1.5);--r-w:min(calc(var(--rp-side) + 34em + var(--r-room)), calc(100vw - 2 * var(--r-lmin)));
    --r-lmin:max(72px, 8vw);font-size:var(--r-fs);
    left:max(var(--r-lmin), calc((100vw - var(--r-w)) / 2));top:calc(var(--edge) + var(--sa-t));width:var(--r-w);max-width:none;height:auto;
    max-height:calc(100dvh - 2 * var(--edge) - var(--sa-t) - var(--sa-b));display:flex;flex-direction:column;padding:var(--rp-top) 0 0 var(--rp-side)}
  #panel.reading .body{display:none}
  #panel.reading #reader{display:block;flex:1 1 auto;min-height:0;overflow:auto;overscroll-behavior:contain;outline:none;
    padding:0 var(--r-room) calc(var(--p-in) * 2) 0;scrollbar-width:thin;scrollbar-color:color-mix(in srgb, currentColor 35%, transparent) transparent}
  :root[data-print] #panel.reading{filter:none}   /* [eee] no ink edge on the reading plate: a filter over a scrolling box re-rasters on every scroll, and blurs long copy */
  html.reading #logo,html.reading #legend,html.reading #tools,html.reading #zoom,html.reading #snaptune{visibility:hidden}   /* the map's chrome steps aside */
  #reader h1,#reader h2,#reader h3,#reader strong,#reader em{font-weight:inherit;font-style:normal}   /* TYPE-002, DONT-001: one weight */
  /* title: direction size (TYPE-006, Grid 2 cap 4¼in of the plate's inch), never wider than the phone allows */
  #rtitle{font-size:min(calc(var(--p-in) * 4.25 / var(--cap-em)), 8vw);line-height:var(--lh-g2);text-wrap:balance;
    --t-trim:calc((var(--trim-k) - var(--lh-g2) / 2) * 1em);margin:var(--t-trim) 0 .7em calc(-1 * var(--lsb-pull))}

      g.animate([box(r1.left,r1.top,r1.width,r1.height),box(x,y,popW,popH)],{duration:ms,easing:'cubic-bezier(.33,1,.68,1)',fill:'forwards'})
        .finished.then(()=>{g.remove();panel.classList.remove('hold')},()=>{g.remove();panel.classList.remove('hold')})}}

}
function closeReader(){
  if(!reading)return;
  if(history.state&&history.state.eeeRead){history.back();return}   // the hashchange that follows closes it (fromHash)
  exitReading(); try{history.replaceState(null,'','#'+current.id)}catch(e){}
}
// [eee] random stop by train (DESIGN.ride, 2026-11-21 사용자 요청: 룰렛보다 열차와 이어지게). The picked station's
// line train stops, the camera glides onto it (board), then rides it to the station: the train speeds up and brakes,
// the camera stays on it, and the popup opens when it stops. Afterwards the train runs on from there, the same way.
// Picks come from a shuffled bag, so every post comes up once before any repeats. Touching the map gets off (release()).
let ride=null, rbag=[];
const trainAt=L=>{const p=L.tpos<1?L.tpos:2-L.tpos;return p*L.plen};   // distance along the line (trains run back and forth)
function stopRide(){if(!ride)return;const r=ride;ride=null;if(r.d!=null)r.L.tpos=r.fwd?r.d/r.L.plen:2-r.d/r.L.plen}
function randomStop(){
  stopRide(); if(current)closePanel();
  if(!rbag.length){rbag=stations.slice();for(let i=rbag.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[rbag[i],rbag[j]]=[rbag[j],rbag[i]]}}   // Fisher–Yates: sort(()=>random) is lopsided (WebKit picked the Sunday lines ~60% of the time)
  const s=rbag.pop(), L=s.line;
  if(reduce||!L.plen){openStation(s);return}
  focusLine(L);
  const d0=trainAt(L), d1=Math.min(L.plen,Math.max(0,s.len)), R=DESIGN.ride, t0=performance.now()+R.boardMs;
  const dur=Math.max(R.minMs,Math.min(R.maxMs,Math.abs(d1-d0)/R.pxPerMs));
  const q=GEO.pointAt(L.model,d0), [cx,cy]=visibleCentre(), [z0,z1]=DESIGN.zoom.focus, k=Math.min(z1,Math.max(view.k,z0));
  animateTo({k,x:cx-q[0]*k,y:cy-q[1]*k},R.boardMs);
  ride={L,s,d0,d1,d:d0,fwd:d1>=d0,t0,dur,k};
}
// called every frame for the riding train: where it is now (and the camera on it); null once it has arrived
function rideStep(t){const r=ride; if(t<r.t0)return r.d0;
  const p=Math.min(1,(t-r.t0)/r.dur), e=p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;   // ease in-out: a train pulls away and brakes
  r.d=r.d0+(r.d1-r.d0)*e; target=null;
  const q=GEO.pointAt(r.L.model,r.d),[cx,cy]=visibleCentre(); view={k:r.k,x:cx-q[0]*r.k,y:cy-q[1]*r.k}; apply();
  if(p>=1){stopRide(); openStation(r.s,false,true); follow=r.s}

$('#randbtn').onclick=randomStop;
addEventListener('keydown',e=>{if(e.key==='Escape'){if(reading)closeReader();else closePanel()}});
svg.addEventListener('click',e=>{
  if(moved)return;
  if(reading){closeReader();return}   // [eee] a click anywhere outside the reading plate goes back, like 돌아가기 (2026-11-21 사용자 요청)
  const hit=document.elementFromPoint(e.clientX,e.clientY), g=hit&&hit.closest&&hit.closest('.station');
  if(g){const s=stations.find(x=>x.g===g&&!x.owner)||stations.find(x=>x.g===g)||ghosts().find(x=>x.g===g); if(s){openStation(s);return}}
  if(current)closePanel();
});

// ---------- growth animation ----------
const SPEED=DESIGN.motion.growPxPerMs;
function cumDist(P){const c=[0];for(let i=1;i<P.length;i++)c.push(c[i-1]+Math.hypot(P[i][0]-P[i-1][0],P[i][1]-P[i-1][1]));return c}
function popStation(s,at){if(!s.g||s.g._popped===at)return;s.g._popped=at;const X=s.vx??s.x,Y=s.vy??s.y;
  s.g.animate([{opacity:0,transform:`translate(${X}px,${Y}px) scale(.2)`},{opacity:1,transform:`translate(${X}px,${Y}px) scale(1.3)`,offset:.7},{opacity:1,transform:`translate(${X}px,${Y}px) scale(1)`}],{duration:DESIGN.motion.popMs,delay:at,easing:'ease-out',fill:'backwards'})}
function growLine(L,start){
  let end=start;
  L.subs.forEach((p,si)=>{
    const len=p._len,dur=Math.min(1600,Math.max(250,len/SPEED));
    [p,p._case].forEach(n=>{n.style.strokeDasharray=len;
      n.animate([{strokeDashoffset:len},{strokeDashoffset:0}],{duration:dur,delay:start,easing:'cubic-bezier(.35,0,.25,1)',fill:'backwards'})});
    // stations along this sub-path
    p._seq.forEach((s,i)=>{ if(s.owner)return; popStation(s,start+dur*Math.pow(Math.max(0,Math.min(1,p._sd[i]/(len||1))),.9)) });
    end=Math.max(end,start+dur);
  });
  [...gB.querySelectorAll(`[data-line="${L.key}"]`),...gN.querySelectorAll(`[data-line="${L.key}"]`),L.train].forEach(n=>n&&n.animate([{opacity:0},{opacity:1}],{duration:300,delay:end,fill:'backwards'}));
  return end;
}
// [eee] back from a web-series article (posts/*.html, G): no growth intro, its station opens at once
const FROM_POST=(()=>{try{const r=new URL(document.referrer);return r.origin===location.origin&&/\/posts\/[^/]+\.html$/.test(r.pathname)}catch(e){return false}})();
const START_READ=/^#read=/.test(location.hash);   // opened straight on an article: the plate is there from the start
function intro(){
  if(reduce||FROM_POST||START_READ)return;
  // a line starts growing when its parent line's growth reaches the transfer
  const start=new Map(),dur=L=>L.subs.map(p=>Math.min(1600,Math.max(250,p._len/SPEED)));
  const order=[],add=L=>{if(order.includes(L))return;order.push(L);LINES.forEach(C=>{if(C.parent===L)add(C)})};
  add(main);LINES.forEach(L=>{if(!L.lead)add(L)});LINES.forEach(add);   // a parent always starts before its children
  let end=0;
  order.forEach(L=>{
    let t0=0;const P=L.parent;
    if(P&&start.has(P)){const from=P.st[P.k].len,at=P.st[L.pk].len,fwd=at>=from,sub=P.subs[fwd||P.subs.length<2?0:1],
      d=dur(P)[fwd||P.subs.length<2?0:1]||0,len=sub?sub._len:1;t0=start.get(P)+d*Math.pow(Math.min(1,Math.abs(at-from)/(len||1)),.9)+120}
    start.set(L,t0);end=Math.max(end,growLine(L,t0));
  });
  // the stations repeated over the trains (#trainover) show once every line has grown; the map is moving until then
  $('#trainover').animate([{opacity:0},{opacity:1}],{duration:300,delay:end,fill:'backwards'}); inMotion(end+300);
}
// ---------- loop ----------
let lt=performance.now();
function frame(t){
  const dt=Math.min(50,t-lt); lt=t;
  if(target)target(t);
  { const mv=sdrag&&sdrag.active?sdrag.moving:settle&&settle.moving;
    if(mv){const m=relax(mv); if(m>.05){geometry();draw();if(sdrag&&sdrag.snap&&sdrag.snap.g)sdrag.snap.g.classList.add('snap')}
      if(!sdrag&&settle&&(m<=.05||t-settle.t0>PULL.settleMs)){const mv2=settle.moving;settle=null;afterSettle(mv2)}} }
  stepTween(t);
  if(curvedNow.length&&!tween&&!settle&&!(sdrag&&sdrag.active))reportCurved();
  placePopup();
  if(!reduce) LINES.forEach(L=>{ if(!L.plen)return;
    let d; if(ride&&ride.L===L)d=rideStep(t);   // the random-stop ride drives this train
    else{L.tpos=(L.tpos+dt/(L.plen*DESIGN.train.speed))%2; const p=L.loop?L.tpos%1:(L.tpos<1?L.tpos:2-L.tpos); d=p*L.plen}
    const q=GEO.pointAt(L.model,d);   // [x, y, direction]
    const tr=`translate(${q[0]},${q[1]}) rotate(${q[2]*180/Math.PI})`; L.train.setAttribute('transform',tr); L.tclip.setAttribute('transform',tr);
  });
  requestAnimationFrame(frame);
}


// ---------- replay & theme ----------
function replay(){
  if(reduce)return;
  const ghost=el('g',{style:'pointer-events:none'},world);
  [gL,gN,gS,gB,gT].forEach(g=>[...g.childNodes].forEach(n=>ghost.appendChild(n)));
  ghost.animate([{opacity:1},{opacity:0}],{duration:DESIGN.motion.rebuildFadeMs,easing:'ease-out'}).onfinish=()=>ghost.remove();
  build(); refreshFocus(); setTimeout(intro,120);
  if(!follow){const v=fitView(all.map(s=>[s.x,s.y]),innerWidth>640?110:60);animateTo(v,900)}
}

{const G=DESIGN.grid.unit,pt=$('#gridpat');pt.setAttribute('width',G);pt.setAttribute('height',G);pt.querySelector('.gl').setAttribute('d',`M${G} 0H0V${G}`)}

};

// #K-14 opens that station's popup; #read=<post> opens the reading plate (2026-11-21). Leaving #read=… (back) closes the plate
function fromHash(first){
  let h=location.hash.slice(1); try{h=decodeURIComponent(h)}catch(e){}
  const r=h.match(/^read=(.+)$/);
  if(r){const s=stations.find(x=>x.post&&x.slug===r[1]&&!x.owner); if(s&&reading!==s)openReader(s,'none',first); return}

  const m=h.match(/^([A-Z]-\d+)$/); if(m){const s=stations.find(x=>x.id===newId(m[1])); if(s&&s!==current) setTimeout(()=>openStation(s,true),first&&!(reduce||FROM_POST)?900:0)}
}
