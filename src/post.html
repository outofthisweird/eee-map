<!DOCTYPE html>

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE_TEXT__ — EEE</title>
<meta name="description" content="__SUMMARY__">
<link rel="stylesheet" href="post.css">
<script>/* ◐ 노선도에서 고른 흑백 반전을 그대로 따른다(localStorage eee-theme). 로컬에서는 헬베티카 미리보기(src/map.html과 같은 규칙) */
(function(){try{if(localStorage.getItem('eee-theme')==='dark')document.documentElement.dataset.theme='dark'}catch(e){}
var q=location.search,local=location.protocol==='file:'||/^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname);
if(/[?&]font=helvetica\b/.test(q)||(local&&!/[?&]font=web\b/.test(q)))document.write('<link rel="stylesheet" href="../preview/helvetica.css?'+Date.now()+'">')})();</script>
</head>
<body>
<svg aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden"><symbol id="arrow" viewBox="-0.5 -0.5 1 1"><path d="M -0.488 -0.1015 L 0.119 -0.1015 L -0.048 -0.269 L 0.096 -0.403 L 0.5 0 L 0.096 0.403 L -0.048 0.269 L 0.119 0.1015 L -0.488 0.1015 Z"/></symbol></svg>
<div class="page module-scope">
  <!-- nycta 구성요소만 쓴다: 표준 길이 모듈 판 .plate>.m(GRID-012), 끝 줄 .plate>.m 안의 .nav(DEC-014) -->
  <main>
    <article>
      <header>
        <div class="plate head"><div class="m hcell">__HEADDISC__</div><div class="m m-6"><h1 class="t-direction trim">__TITLE__</h1></div></div>
      </header>
      <div class="body">
__BODY__
      </div>
    </article>
    <nav class="plate seqbar" aria-label="이전 글, 다음 글, 돌아가기"><div class="m m-6"><ul class="trim">__SEQ__</ul></div></nav>
  </main>
</div>
<script>/* [eee] 모듈 판 길이(글 머리·끝 줄): 노선도 로고·범례(fitPlates)와 같은 규칙. 표준 길이(GRID-012/SIGN-012) 1·2·4·6ft 중
   글 한 줄 옆에 1in 이상 남는 가장 짧은 것(DEC-030), 안 되면 6ft. 제목은 6ft에서 줄을 바꾸고, 끝 줄은 6ft에서 글처럼 흘러 다음 줄로 이어진다.
   높이는 1ft, 넘치면 1ft 단위. 스크립트가 없으면 6×1ft */
(function(){var L=[1,2,4,6],cells=[].slice.call(document.querySelectorAll('.page .plate>.m:not(.hcell)'));if(!cells.length)return;
function fit(){cells.forEach(function(c){var t=c.firstElementChild;
  L.forEach(function(n){c.classList.remove('m-'+n)});c.classList.add('m-6');c.style.height='';c.style.width='';
  var M=c.getBoundingClientRect().width/6,inch=M/12,r=document.createRange();
  var w;if(t.tagName==='UL'){t.style.width='max-content';w=t.getBoundingClientRect().width;t.style.width=''}   /* 끝 줄: 한 줄일 때의 길이 */
  else{t.style.maxWidth='';t.style.whiteSpace='nowrap';r.selectNodeContents(t);w=r.getBoundingClientRect().width;t.style.whiteSpace=''}
  if(c.previousElementSibling&&c.previousElementSibling.classList.contains('hcell')&&t.tagName!=='UL'){   /* 원판 칸 옆 제목은 두 줄(SIGN-016처럼): 한 줄 길이의 절반부터 넓혀 두 줄이 되는 가장 좁은 폭, balance로 고르게, 가장 긴 줄로 판 길이를 고른다 */
    var h1=t.getBoundingClientRect().height,lh=parseFloat(getComputedStyle(t).lineHeight),f;t.style.whiteSpace='nowrap';h1=t.getBoundingClientRect().height;t.style.whiteSpace='';
    for(f=.5;f<1;f+=.04){t.style.maxWidth=Math.ceil(w*f)+'px';if(t.getBoundingClientRect().height<=h1+lh*1.5)break}if(f>=1)t.style.maxWidth='';r.selectNodeContents(t);var L0=t.getBoundingClientRect().left;w=0;[].forEach.call(r.getClientRects(),function(x){w=Math.max(w,x.right-L0)})}
  var h=c.previousElementSibling&&c.previousElementSibling.classList.contains('hcell'),pad=h?0:inch*.5;   /* 원판 칸 옆 제목 칸: 왼쪽 여백은 원판 칸이 준다 */
  var n=L.filter(function(n){return pad+w+inch<=n*M&&(!h||n<6)})[0]||(h?5:0);if(n){c.classList.remove('m-6');if(n>1)c.classList.add('m-'+n);if(n===5)c.style.width=5*M+'px'}
  var H=c.scrollHeight;if(H>M+1)c.style.height=Math.ceil(H/M-.02)*M+'px'})}
fit();if(document.fonts)document.fonts.ready.then(fit);addEventListener('resize',fit)})();</script>
</body>
