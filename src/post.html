<script>/* [eee] 글 머리 판 길이: 노선도 로고·범례(fitPlates)와 같은 규칙. 표준 길이(GRID-012/SIGN-012) 4·6ft 중 제목 한 줄 옆에
   1in 이상 남는 가장 짧은 것(DEC-030), 안 되면 6ft에서 줄을 바꾼다. 높이는 1ft, 넘치면 1ft 단위. 스크립트가 없으면 6×1ft */
(function(){var c=document.querySelector('.head .m'),h=c&&c.querySelector('h1');if(!h)return;
function fit(){c.classList.remove('m-4');c.classList.add('m-6');c.style.height='';
  var M=c.getBoundingClientRect().width/6,inch=M/12,r=document.createRange();
  h.style.whiteSpace='nowrap';r.selectNodeContents(h);var w=r.getBoundingClientRect().width;h.style.whiteSpace='';
  if(inch*.5+w+inch<=4*M){c.classList.remove('m-6');c.classList.add('m-4')}
  var H=c.scrollHeight;if(H>M+1)c.style.height=Math.ceil(H/M-.02)*M+'px'}
fit();if(document.fonts)document.fonts.ready.then(fit);addEventListener('resize',fit)})();</script>
